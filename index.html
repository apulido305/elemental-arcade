<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Periodic table card quiz game: win element, ion and isotope cards by answering questions.">
<title>Elemental Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one navy arcade cabinet. Top bar with trainer level, then deck chips, then a grid of room tiles. Quiz is a single panel, answers in a 2x2 grid, card revealed after answering. */
:root{
  --bg0:#0b1030; --bg1:#161f58; --panel:#141c52; --panel2:#1d2870; --line:#2f3d94;
  --gold:#f3dd7a; --goldd:#a98d1a; --cream:#fdf6d8; --creamd:#b9ae7c; --sky:#7fd1f0; --rose:#f2a8a3;
  --text:#eef0fb; --mute:#aab3e6; --good:#4caf62; --goodd:#1f6b3a; --bad:#d9534f; --badd:#a12a2a; --shadow:#060a24;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg0)}
body{margin:0;background:radial-gradient(120% 520px at 50% 0,#26358f,rgba(11,16,48,0) 75%),var(--bg0);color:var(--text);font:400 16px/1.45 var(--body);min-height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
sup{font-size:.62em;line-height:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 56px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo b{display:block;font:400 24px/1 var(--display);letter-spacing:2.5px;color:#fff}
.logo small{display:block;margin-top:3px;font:700 9px/1 var(--body);letter-spacing:3px;color:var(--gold)}
.trainer{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:150px}
.lvl span{font:700 12px/1 var(--body);letter-spacing:.6px;color:var(--mute)}
.lvl span b{font:400 15px/1 var(--display);color:var(--gold);letter-spacing:.5px;margin-right:6px}
.xp{height:10px;border-radius:6px;background:var(--bg0);border:2px solid var(--line);overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold);border-radius:4px}
.iconbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);cursor:pointer;font:700 14px/1 var(--body)}
.iconbtn b{font:400 16px/1 var(--display);color:var(--gold)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border-radius:13px;border:0;cursor:pointer;background:var(--gold);color:#241c00;font:400 18px/1 var(--display);letter-spacing:.5px;box-shadow:0 5px 0 var(--goldd)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--goldd)}
.btn.ghost{background:var(--panel2);color:var(--text);border:2px solid var(--line);box-shadow:0 5px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shadow)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px;box-shadow:0 4px 0 var(--goldd)}
.btn.ghost.small{box-shadow:0 4px 0 var(--shadow)}

/* headings */
h1,h2,h3{margin:0;font-weight:400}
.h{font:400 26px/1.1 var(--display);color:#fff;letter-spacing:.4px}
.sub{color:var(--mute);margin:4px 0 0;max-width:62ch}
.sec{margin-top:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* decks */
.decks{display:flex;flex-wrap:wrap;gap:10px}
.deck{display:flex;flex-direction:column;gap:2px;min-width:112px;padding:9px 14px 10px;border-radius:14px;background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);cursor:pointer;text-align:left}
.deck b{font:400 17px/1.1 var(--display);color:var(--cream);letter-spacing:.3px}
.deck span{font-size:12px;color:var(--mute)}
.deck em{font:700 12px/1 var(--body);font-style:normal;color:var(--gold);margin-top:3px}
.deck.on{border-color:var(--gold);background:var(--panel2);box-shadow:0 4px 0 var(--goldd)}
.deck.on b{color:#fff}
.deck:active{transform:translateY(2px)}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.room{display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:18px;background:var(--panel);border:2px solid var(--line);box-shadow:0 6px 0 var(--shadow);cursor:pointer;text-align:left}
.room:hover{border-color:var(--gold)}
.room:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
.room .band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;min-height:74px}
.room .glyph{font:400 38px/1 var(--display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28);letter-spacing:1px;white-space:nowrap}
.room .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:3px}
.room .nm{font:400 21px/1.1 var(--display);color:var(--cream);letter-spacing:.3px}
.room .ds{font-size:14px;color:var(--mute)}
.room[disabled]{opacity:.42;cursor:not-allowed;box-shadow:0 6px 0 var(--shadow)}
.room[disabled]:hover{border-color:var(--line)}
.stars{display:inline-flex;gap:3px}
.stars svg{width:20px;height:20px}
.stars.big svg{width:44px;height:44px}
.foot{margin-top:28px;color:var(--mute);font-size:14px}

/* quiz */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pips{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.pip{height:12px;flex:1;max-width:46px;border-radius:6px;background:var(--bg0);border:2px solid var(--line)}
.pip.ok{background:var(--good);border-color:var(--goodd)}
.pip.no{background:var(--bad);border-color:var(--badd)}
.pip.cur{border-color:var(--gold)}
.hudstat{font:700 14px/1 var(--body);color:var(--mute);display:flex;gap:14px;align-items:center}
.hudstat b{font:400 18px/1 var(--display);color:var(--gold);margin-left:4px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 0 var(--shadow)}
.qmeta{font:700 12px/1 var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.prompt{margin:8px 0 16px;font:400 clamp(24px,4vw,34px)/1.12 var(--display);color:#fff;text-wrap:balance;letter-spacing:.3px}
.clue{display:flex;margin-bottom:18px}
.tilewrap{--ts:1.5;width:calc(212px*var(--ts));height:calc(108px*var(--ts));flex:none}
.tilewrap>.tile{transform:scale(var(--ts));transform-origin:0 0}
@media (max-width:560px){.tilewrap{--ts:1.22}}
@media (max-width:340px){.tilewrap{--ts:1}}
.bignum{display:flex;align-items:center;gap:12px}
.abox{width:100%;max-width:560px;background:#fff;color:#14194a;border:3px solid #2f3a66;border-radius:12px;padding:12px 16px}
.abox .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.abox .tag{background:#2f3a66;color:#fff;font:700 11px/1 var(--body);letter-spacing:1.4px;padding:4px 8px;border-radius:5px}
.abox .an{font:400 22px/1.1 var(--display)}
.abox p{margin:8px 0 0;font-size:17px;line-height:1.4;color:#222}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border-radius:15px;border:0;cursor:pointer;text-align:left;background:var(--cream);color:#14194a;font:400 21px/1.15 var(--display);letter-spacing:.2px;box-shadow:0 5px 0 var(--creamd)}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;background:#2f3a66;color:#fff;font:700 14px/28px var(--body);text-align:center}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.mono .ot{font:500 15px/1.35 var(--mono)}
.opt:not([disabled]):hover{filter:brightness(1.06)}
.opt:not([disabled]):active{transform:translateY(4px);box-shadow:0 1px 0 var(--creamd)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good);color:#fff;box-shadow:0 5px 0 var(--goodd)}
.opt.wrong{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--badd)}
.opt.dim{opacity:.5}
.opt.right .key,.opt.wrong .key{background:rgba(0,0,0,.28)}
.fb{margin-top:20px;border-radius:16px;padding:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;border:2px solid}
.fb.ok{background:rgba(76,175,98,.14);border-color:var(--good)}
.fb.no{background:rgba(217,83,79,.14);border-color:var(--bad)}
.fb .txt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fb h3{font:400 26px/1.1 var(--display);color:#fff}
.fb p{margin:0;font-size:17px}
.fb .win{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#241c00;border-radius:8px;padding:5px 10px;font:700 13px/1 var(--body);letter-spacing:.6px}

/* cards */
.cw{--cs:1;width:calc(240px*var(--cs));height:calc(336px*var(--cs));flex:none;position:relative}
.cw>.card{transform:scale(var(--cs));transform-origin:0 0;position:absolute;left:0;top:0}
.cardbtn{background:none;border:0;padding:0;cursor:pointer;border-radius:10px;display:block}
.cardbtn:hover .cw{filter:brightness(1.07)}

/* results */
.res{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--bg0);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{display:block;font:700 11px/1 var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}
.stat b{display:block;margin-top:6px;font:400 30px/1 var(--display);color:var(--gold)}
.lvup{background:var(--gold);color:#241c00;border-radius:14px;padding:12px 16px;font:400 20px/1.2 var(--display);box-shadow:0 4px 0 var(--goldd)}
.pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw,200px),1fr));gap:16px;justify-items:center}
.flip{perspective:1000px;background:none;border:0;padding:0;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 12px;cursor:pointer;font:700 14px/1 var(--body);box-shadow:0 3px 0 var(--shadow)}
.chip:hover{border-color:var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* binder */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;cursor:pointer;font:700 14px/1 var(--body);display:inline-flex;gap:8px;align-items:center}
.tab em{font-style:normal;color:var(--gold)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#241c00}
.tab.on em{color:#241c00}
.bar{height:14px;border-radius:8px;background:var(--bg0);border:2px solid var(--line);overflow:hidden;max-width:420px;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--gold))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px 12px;justify-items:center}
.slot{width:110px;height:155px;border-radius:10px;border:2px dashed var(--line);background:linear-gradient(165deg,#161f58,#0d1238);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#3f4eb0}
.slot b{font:400 30px/1 var(--display)}
.slot span{font:700 9px/1 var(--body);letter-spacing:1.6px}
.slot svg{width:18px;height:18px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,28,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:auto}
.modal .meta{color:var(--mute);font-size:14px;text-align:center}

.auth{max-width:560px}
.fields{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:700 13px/1 var(--body);letter-spacing:.8px;text-transform:uppercase;color:var(--gold)}
.field input{width:100%;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg0);color:var(--text);font:400 20px/1.2 var(--body)}
.field input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(243,221,122,.3)}
.field small{color:var(--mute);font-size:13px}
.chk{display:flex;align-items:flex-start;gap:10px;margin-top:14px;color:var(--text);font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:#f3dd7a;flex:none}
.err{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:rgba(217,83,79,.16);border:2px solid var(--bad);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
@media (max-width:520px){.trainer{flex:1 1 100%;margin-left:0;gap:8px}.lvl{min-width:0;flex:1 1 100%}.iconbtn{padding:6px 10px;min-height:38px;gap:6px;white-space:nowrap}}
/* card levels */
.foil{position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:overlay;opacity:1;background:linear-gradient(115deg,rgba(255,255,255,0) 18%,rgba(255,60,170,.75) 31%,rgba(255,225,50,.75) 41%,rgba(40,255,190,.75) 51%,rgba(70,130,255,.75) 61%,rgba(200,70,255,.75) 71%,rgba(255,255,255,0) 84%);background-size:260% 260%;background-position:var(--hx,35%) var(--hy,35%)}
.foil::after{content:'';position:absolute;inset:0;border-radius:16px;mix-blend-mode:normal;background:inherit;opacity:.22}
.foil.gold{background:linear-gradient(115deg,rgba(255,255,255,0) 16%,rgba(255,235,140,.85) 32%,rgba(255,255,255,.9) 45%,rgba(255,196,50,.85) 58%,rgba(255,255,255,0) 82%);background-size:260% 260%;background-position:var(--hx,35%) var(--hy,35%)}
.spark{position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:screen;opacity:.4;background:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.7px) 0 0/13px 13px,radial-gradient(circle,rgba(255,255,255,.8) 0 .8px,transparent 1.5px) 6px 7px/17px 17px;-webkit-mask-image:linear-gradient(115deg,transparent 14%,#000 40%,#000 60%,transparent 86%);mask-image:linear-gradient(115deg,transparent 14%,#000 40%,#000 60%,transparent 86%);-webkit-mask-size:260% 260%;mask-size:260% 260%;-webkit-mask-position:var(--hx,35%) var(--hy,35%);mask-position:var(--hx,35%) var(--hy,35%)}
.cw.anim .foil,.cw.anim .foil::after,.cw.anim .spark{animation:sheen 5s ease-in-out infinite alternate}
@keyframes sheen{from{background-position:10% 10%;-webkit-mask-position:10% 10%;mask-position:10% 10%}to{background-position:90% 90%;-webkit-mask-position:90% 90%;mask-position:90% 90%}}
.cw{transition:transform .12s ease-out}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.tcap{display:flex;flex-direction:column;align-items:center;gap:1px;font:700 11px/1.1 var(--body);color:var(--mute);letter-spacing:.3px}
.tcap em{font-style:normal;color:var(--gold);letter-spacing:1px;font-size:10px}
.tcap u{text-decoration:none;color:#3a4690}
.cxp{display:flex;flex-direction:column;gap:4px;width:100%;max-width:340px;font-size:14px;color:var(--mute)}
.bar2{height:10px;border-radius:6px;background:var(--bg0);border:2px solid var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--gold))}
.win.up{background:linear-gradient(90deg,#fff3b0,#f3dd7a)}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw,200px),1fr));gap:16px;justify-items:center}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes deal{from{opacity:0;transform:translateY(28px) rotate(-5deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(243,221,122,0))}50%{filter:drop-shadow(0 0 16px rgba(243,221,122,.95))}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes pulse{50%{transform:scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
main.enter>*{animation:fadeIn .3s backwards}
.enter .room{animation:rise .4s backwards;animation-delay:calc(var(--i,0)*45ms + 100ms)}
.enter .cell,.enter .slot{animation:fadeIn .35s backwards;animation-delay:calc(var(--i,0)*14ms)}
.enter .flip{animation:deal .55s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i,0)*.12s + .35s)}
.enter .stat{animation:rise .4s backwards}
.enter .stat:nth-child(2){animation-delay:.08s}.enter .stat:nth-child(3){animation-delay:.16s}.enter .stat:nth-child(4){animation-delay:.24s}
.opt.right{animation:pop .4s}
.opt.wrong{animation:shake .42s}
.fb{animation:rise .35s backwards}
.cw.deal{animation:deal .5s cubic-bezier(.2,.9,.3,1.15) backwards}
.cw.levelup{animation:deal .55s cubic-bezier(.2,.9,.3,1.15) backwards,glow 1.1s .55s 2}
.stars.big svg.on{animation:starpop .55s backwards;animation-delay:calc(var(--k,0)*.2s + .25s)}
.stars.big svg:not(.on){animation:fadeIn .5s backwards}
.lvup{animation:pop .6s .3s backwards}
.pip.new{animation:pop .35s}
.hudstat .hot b{display:inline-block;animation:pulse .9s ease-in-out infinite}
.logo svg{animation:spin 40s linear infinite}
.xp i,.bar2 i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.modal{animation:fadeIn .18s backwards}
.modal .cw{animation:deal .45s cubic-bezier(.2,.9,.3,1.15) backwards}
.grid .cardbtn:hover .cw{transform:translateY(-5px) scale(1.04)}
/* VS Arena entry on home */
.vsrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.vsbtn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:56px;padding:9px 22px;border-radius:15px;border:3px solid var(--gold);background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--gold);cursor:pointer;font:400 24px/1 var(--display);letter-spacing:1.5px;box-shadow:0 5px 0 var(--shadow),0 0 18px rgba(243,221,122,.22)}
.vsbtn small{font:700 12px/1 var(--body);letter-spacing:.6px;color:var(--mute)}
.vsbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.vsrec{font:400 18px/1 var(--mono);color:var(--cream)}
.vsoff{margin:0 0 16px;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (prefers-reduced-motion:reduce){.cw.anim .foil,.cw.anim .foil::after,.cw.anim .spark{animation:none}.cw{transition:none}}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.btn,.opt,.room,.deck{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>

/* ---------- helpers ---------- */
/* Question randomness goes through RNG. Solo play leaves it as Math.random; VS Arena swaps in a seeded
   generator inside makeQ so every client builds the identical round. */
let RNG=Math.random;
const rand=()=>RNG();
const rnd=n=>Math.floor(rand()*n);
function mulberry32(seed){
  let a=seed>>>0;
  return function rng(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffle(list,rng){
  const r=rng||rand;const a=list.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  return a;
}

const mask=(it,s)=>String(s).replace(new RegExp('\\b'+base(it).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','gi'),'_____');
const kindWord=it=>({el:'element',cat:'ion',an:'ion',poly:'polyatomic ion',iso:'isotope'})[it.cat];

    const p=it.zn,n=+it.s2v,e=+it.s3v;let ans,why;
    if(target==='neutrons'){
      ans=n;
      why=it.cat==='iso'?'Neutrons = mass number − protons = '+esc(it.pre)+' − '+p+' = <b>'+n+'</b>.':'Neutrons = rounded mass − protons = '+Math.round(parseFloat(it.mass))+' − '+p+' = <b>'+n+'</b>.';
    }else{
      ans=e;const c=charge(it.post);
      why=it.cat==='iso'?'A neutral atom has as many electrons as protons: <b>'+e+'</b>.':
        it.cat==='cat'?'It has '+p+' protons and lost '+(c?c.n:0)+' electron'+((c&&c.n>1)?'s':'')+': '+p+' − '+(c?c.n:0)+' = <b>'+e+'</b>.':
        'It has '+p+' protons and gained '+(c?c.n:0)+' electron'+((c&&c.n>1)?'s':'')+': '+p+' + '+(c?c.n:0)+' = <b>'+e+'</b>.';
    }
    return{prompt:'How many '+target+' does '+esc(it.name)+' have?',clue:tileScaled(it,{neutral:true}),opts:numOpts(ans,0,160),
      exp:'<p>'+why+'</p>'};
  }
};
function supports(it,t){
  switch(t){
    case 'number':case 'table':return it.cat==='el';
    case 'config':return !!it.config;
    case 'lab':return it.cat!=='el';
    default:return true;
  }
}
function makeQ(it,room,rng){
  const prev=RNG;RNG=rng||Math.random;
  try{
    const types=shuffle(room.types.filter(t=>supports(it,t)));
    for(const t of types){let q=null;try{q=GEN[t](it)}catch(e){q=null}if(q){q.item=it;q.type=t;return q}}
    return null;
  }finally{RNG=prev}
}
/* VS Arena: the same 10 questions for everyone, locked to the match seed. Pure apart from reading the card data.
   Samples without replacement; repeats a card only when the pool has fewer than 10. */
function buildRound(deckId,roomId,seed){
  const room=roomOf(roomId);const rng=mulberry32(seed);
  const prevDeck=QDECK;QDECK=deckId;
  try{
    const pool=roomPool(room,deckId);if(!pool.length)return [];
    let order=shuffle(pool,rng);
    while(order.length<10)order=order.concat(shuffle(pool,rng));
    const out=[];
    for(let i=0;i<order.length&&out.length<10;i++){
      const q=makeQ(order[i],room,rng);if(!q)continue;
      out.push({prompt:q.prompt,clue:q.clue,options:q.opts.map(o=>o.h),correct:q.opts.findIndex(o=>o.ok),cardId:q.item.id,type:q.type,mono:!!q.mono,exp:q.exp});
    }
    return out;
  }finally{QDECK=prevDeck}
}

const V={anim:'',fx:'',xpFrom:null,cardFrom:null,authTab:'in',authErr:'',authBusy:false,form:{cls:'',nick:'',pin:'',keep:false,bring:true},screen:'home',roomId:null,deckId:S.deck,qs:[],qi:0,pick:null,res:[],score:0,streak:0,best:0,newIds:[],missed:[],tab:'all',modal:null,flipped:{},lvBefore:1,lvAfter:1,ups:[],lastUp:-1,lastCount:0,xpGain:0,stars:0,perfect:false,lastPts:0,lastNew:false};
const cur=()=>V.qs[V.qi];
const roomOf=id=>ROOMS.find(r=>r.id===id);
const roomPool=(room,deckId)=>deckItems(deckId).filter(it=>room.types.some(t=>supports(it,t)));

function startRound(roomId){
  const room=roomOf(roomId);const pool=roomPool(room,S.deck);
  if(!pool.length)return;
  V.deckId=S.deck;
  const n=Math.min(10,Math.max(5,pool.length));
  const picks=[];let bag=pool.slice();
  while(picks.length<n){
    if(!bag.length)bag=pool.slice();
    const w=bag.map(it=>!S.owned[it.id]?3:(S.miss[it.id]?2:1));
    let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    while(i<w.length-1&&r>=w[i]){r-=w[i];i++}
    picks.push(bag[i]);bag.splice(i,1);
  }
  V.qs=picks.map(it=>makeQ(it,room)).filter(Boolean);
  if(!V.qs.length)return;
  Object.assign(V,{anim:'screen',cardFrom:null,screen:'quiz',roomId,qi:0,pick:null,res:[],score:0,streak:0,best:0,newIds:[],missed:[],ups:[],lastUp:-1,flipped:{},lvBefore:levelInfo(S.xp).lvl});
  render();window.scrollTo(0,0);
}
function answer(i){
  if(V.pick!=null)return;
  const q=cur();if(!q||!q.opts[i])return;
  V.pick=i;const ok=q.opts[i].ok;V.res[V.qi]=ok;
  if(ok){
    V.streak++;V.best=Math.max(V.best,V.streak);
    V.lastPts=10+Math.min(10,Math.max(0,V.streak-2)*2);V.score+=V.lastPts;
    const before=S.owned[q.item.id]||0;V.lastNew=!before;S.owned[q.item.id]=before+1;V.lastCount=before+1;
    const t0=tierOf(before),t1=tierOf(before+1);V.lastUp=(t0>=0&&t1>t0)?t1:-1;
    {const bt=nextTier(before),bp=prevAt(before);V.cardFrom=V.lastUp>=0?0:(bt?Math.round((before-bp)/(bt.at-bp)*100):100)}
    V.fx=V.lastUp>=0?'level':'ok';
    if(V.lastNew)V.newIds.push(q.item.id);
    if(V.lastUp>=0)V.ups.push({id:q.item.id,tier:V.lastUp});
    tone(V.lastUp>=0?'level':'ok');
  }else{
    V.streak=0;V.lastUp=-1;S.miss[q.item.id]=(S.miss[q.item.id]||0)+1;
    if(!V.missed.includes(q.item.id))V.missed.push(q.item.id);
    tone('no');
  }
  save();render();
}
function next(){
  if(V.pick==null)return;
  if(V.qi+1<V.qs.length){V.qi++;V.pick=null;V.anim='screen';V.cardFrom=null;render();window.scrollTo(0,0);return}
  const correct=V.res.filter(Boolean).length,ratio=correct/V.qs.length;
  V.perfect=correct===V.qs.length;
  V.stars=ratio>=.9?3:ratio>=.7?2:ratio>=.5?1:0;
  V.xpGain=V.score+(V.perfect?20:0);
  V.lvBefore=levelInfo(S.xp).lvl;S.xp+=V.xpGain;V.lvAfter=levelInfo(S.xp).lvl;
  const k=V.roomId+'|'+V.deckId;S.stars[k]=Math.max(S.stars[k]||0,V.stars);
  S.rounds++;S.best=Math.max(S.best,V.best);save();
  V.screen='results';V.anim='results';V.fx=V.perfect?'perfect':'';tone('win');render();window.scrollTo(0,0);
}

const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
function afterRender(){
  const fx=V.fx,an=V.anim;V.fx='';V.anim='';
  app.querySelectorAll('[data-w]').forEach(el=>{requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.width=el.dataset.w+'%'}))});
  const xi=app.querySelector('.xp i[data-w]');if(xi)V.xpFrom=+xi.dataset.w;
  if(an==='results')countUps();
  if(fx)requestAnimationFrame(()=>doFx(fx));
}
function countUps(){
  if(RM.matches)return;
  app.querySelectorAll('[data-count]').forEach(el=>{
    const v=+el.dataset.count,pre=el.dataset.pre||'',post=el.dataset.post||'',t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/800),e=1-Math.pow(1-k,3);el.textContent=pre+Math.round(v*e)+post;if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function burst(cx,cy,n,spread,colors){
  for(let i=0;i<n;i++){
    const d=document.createElement('i'),sz=5+Math.random()*6;
    d.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;width:'+sz+'px;height:'+(sz*(Math.random()<.5?1:.5))+'px;background:'+colors[i%colors.length]+';border-radius:2px;pointer-events:none;z-index:60';
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=spread*(.4+Math.random()*.8),dx=Math.cos(a)*v,dy=Math.sin(a)*v-spread*.35;
    const an=d.animate([{transform:'translate(-50%,-50%) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(dy+spread*.7)+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:0}],{duration:750+Math.random()*500,easing:'cubic-bezier(.15,.7,.3,1)'});
    an.onfinish=()=>d.remove();
  }
}
function doFx(kind){
  if(RM.matches)return;
  const cols=['#f3dd7a','#7fd1f0','#f2a8a3','#fdf6d8','#4caf62'];
  const mid=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
  if(kind==='ok'){const el=app.querySelector('.opt.right');if(el){const [x,y]=mid(el);burst(x,y,14,90,cols)}}
  else if(kind==='level'){const el=app.querySelector('.fb .cw')||app.querySelector('.opt.right');if(el){const [x,y]=mid(el);burst(x,y,44,240,cols.concat(['#ff5ab4','#47ffbe','#ffffff']))}}
  else if(kind==='perfect'){burst(innerWidth/2,Math.min(200,innerHeight/3),64,300,cols.concat(['#ff5ab4','#47ffbe']))}
}

/* ---------- events ---------- */
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]'))return;
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='closemodal'){V.modal=null;render();return}
  if(a==='deck'){S.deck=id;V.deckId=id;save();render()}
  else if(a==='room')startRound(id);
  else if(a==='answer')answer(+t.dataset.i);
  else if(a==='next')next();
  else if(a==='home'){V.anim='screen';V.screen='home';V.modal=null;render();window.scrollTo(0,0)}
  else if(a==='binder'){V.anim='screen';V.screen='binder';V.modal=null;render();window.scrollTo(0,0)}
  else if(a==='tab'){V.tab=id;V.anim='screen';render()}
  else if(a==='account'){V.anim='screen';V.screen='account';V.authErr='';V.modal=null;render();window.scrollTo(0,0)}
  else if(a==='authtab'){V.authTab=id;V.authErr='';render()}
  else if(a==='signout'){Cloud.signOut()}
  else if(a==='vs'){if(window.VSArena)window.VSArena.open()}
  else if(a==='mute'){S.mute=!S.mute;save();render()}
  else if(a==='again')startRound(V.roomId);
  else if(a==='open'){V.modal=id;render()}
  else if(a==='flip'){V.flipped[id]=!V.flipped[id];tone('flip');t.classList.toggle('on',!!V.flipped[id])}
  else if(a==='flipall'){V.newIds.forEach(i=>V.flipped[i]=true);tone('flip');app.querySelectorAll('.flip').forEach(b=>b.classList.add('on'))}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&V.modal){V.modal=null;render();return}
  if(V.screen==='quiz'&&V.pick==null&&/^[1-4]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey){const i=+e.key-1;if(cur()&&cur().opts[i])answer(i)}
});
/* ---------- accounts (only when cloud.js is present and configured) ---------- */
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
app.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='f-cls')V.form.cls=e.target.value;
  else if(id==='f-nick')V.form.nick=e.target.value;
  else if(id==='f-pin')V.form.pin=e.target.value.replace(/\D/g,'');
});
app.addEventListener('change',e=>{
  if(e.target.id==='f-keep')V.form.keep=e.target.checked;
  if(e.target.id==='f-bring')V.form.bring=e.target.checked;
});
app.addEventListener('submit',async e=>{
  if(e.target.id!=='authform')return;
  e.preventDefault();
  const f=V.form,c=norm(f.cls),n=norm(f.nick),pin=String(f.pin||'');
  const up=V.authTab==='up';
  if(!/^[a-z0-9]{3,12}$/.test(c)){V.authErr='Class code needs 3 to 12 letters or numbers.';render();return}
  if(!/^[a-z0-9]{2,16}$/.test(n)){V.authErr='Nickname needs 2 to 16 letters or numbers.';render();return}
  if(!/^\d{4,6}$/.test(pin)){V.authErr='PIN needs 4 to 6 digits.';render();return}
  V.authErr='';V.authBusy=true;render();
  try{
    if(up){
      const bring=f.bring&&guestCount()>0;const g=bring?readGuest():null;
      await Cloud.signUp(c,n,pin,f.keep,g?{owned:g.owned||{},miss:g.miss||{},stars:g.stars||{},xp:g.xp||0,rounds:g.rounds||0,best:g.best||0}:null);
      if(bring){try{localStorage.removeItem(KEY)}catch(x){}}
    }else await Cloud.signIn(c,n,pin,f.keep);
    V.form.pin='';
  }catch(err){
    const code=String(err&&err.code||'');
    V.authErr=/email-already-in-use/.test(code)?'That nickname is taken in this class. Pick another, or use Sign in if it is yours.':
      /invalid-credential|user-not-found|wrong-password|invalid-login/.test(code)?'The class code, nickname or PIN is not right.':
      /too-many-requests/.test(code)?'Too many tries. Wait a minute and try again.':
      /network/.test(code)?'Cannot reach the server. Check your internet connection.':
      'Something went wrong. Try again.';
  }
  V.authBusy=false;render();
});
function wireCloud(){
  Cloud.onStatus(s=>{SYNC=s;const m=document.getElementById('syncmsg');if(m)m.textContent=SYNCTXT[s]||''});
  Cloud.onChange((user,prog)=>{
    if(user){
      ACCT={nick:user.nick,cls:user.cls};
      try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p){if(typeof p.mute==='boolean')S.mute=p.mute;if(DECKS.some(d=>d.id===p.deck))S.deck=p.deck}}catch(e){}
      applyProg(prog);
      if(V.screen==='account'||V.screen==='quiz'||V.screen==='results')V.screen='home';
      V.modal=null;render();
    }else if(ACCT){
      ACCT=null;SYNC='';loadGuest();V.screen='home';V.modal=null;render();
    }else render();
  });
}
if(window.Cloud)wireCloud();else addEventListener('cloud-ready',()=>{wireCloud();render()},{once:true});
document.addEventListener('pointermove',e=>{
  const cw=document.querySelector('.modal .cw');if(!cw)return;
  const r=cw.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  if(x<0||x>1||y<0||y>1){cw.style.transform='';return}
  cw.classList.remove('anim');cw.style.setProperty('--hx',(x*100).toFixed(1)+'%');cw.style.setProperty('--hy',(y*100).toFixed(1)+'%');
  cw.style.transform='perspective(800px) rotateY('+((x-.5)*16).toFixed(1)+'deg) rotateX('+((.5-y)*16).toFixed(1)+'deg)';
});
let rz=null;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(V.screen!=='home')render()},180)});
/* Hooks for vs.js (VS Arena). Solo play does not depend on any of this. */
window.Arcade={S,V,BY,ALL,TIERS,tierOf,nextTier,tierShown,cardHTML,esc,tone,save,render,levelInfo,DECKS,ROOMS,deckItems,roomPool,roomOf,buildRound,THEMES,
  acct:()=>ACCT,
  goto:scr=>{V.anim='screen';V.screen=scr;V.authErr='';V.modal=null;render();window.scrollTo(0,0)},
  burst:(x,y,n,spread,cols)=>{if(!RM.matches)burst(x,y,n,spread,cols||['#f3dd7a','#7fd1f0','#f2a8a3','#fdf6d8','#4caf62'])}};
render();
</script>
